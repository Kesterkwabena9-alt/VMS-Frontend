<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Visitor Management System</title>
    <link rel="stylesheet" href="assert/loginstyle.css">
    <link rel="stylesheet" href="assert/theme.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="index.html" aria-label="Back to visitor management home">
            <img src="assert/images/logo.jpeg" alt="UTS Developers logo">
            <span>UTS Developers</span>
        </a>
        <div class="time-date" aria-live="polite">
            <strong id="current-time">--:--</strong>
            <span id="current-date">Loading date...</span>
        </div>
    </header>

    <main class="login-shell">
        <p class="eyebrow">Admin access</p>
        <h1>Welcome to VMS</h1>
        <p class="intro">Login to continue</p>

        <form id="login-form" class="login-form" action="#" method="post">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address" autocomplete="email" required>

            <label for="password">Password</label>
            <div class="password-field">
                <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                <button class="password-toggle" id="password-toggle" type="button" aria-label="Show password" title="Show password">
                    <i class="fa-solid fa-eye" aria-hidden="true"></i>
                </button>
            </div>

            <button type="submit" target="_blank">Login to VMS</button>
        </form>
    </main>
<section class="footer">
    <footer>© 2026 UTS Developers. Visitor Management System.</footer>
</section>
<script src="scripts/api.js"></script>
<script src="scripts/auth.js"></script>

    <script src="scripts/theme.js"></script>
    <script>
        const timeElement = document.getElementById('current-time');
        const dateElement = document.getElementById('current-date');
        const dateFormatter = new Intl.DateTimeFormat(undefined, {
            weekday: 'short',
            month: 'short',
            day: 'numeric',
            year: 'numeric'
        });

        function updateDateTime() {
            const now = new Date();
            timeElement.textContent = now.toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit'
            });
            dateElement.textContent = dateFormatter.format(now);
        }

        updateDateTime();
        setInterval(updateDateTime, 1000);

    const loginForm = document.getElementById('login-form');
    const passwordInput = document.getElementById('password');
    const passwordToggle = document.getElementById('password-toggle');

    passwordToggle.addEventListener('click', function() {
        const isPasswordVisible = passwordInput.type === 'text';
        passwordInput.type = isPasswordVisible ? 'password' : 'text';
        passwordToggle.setAttribute('aria-label', isPasswordVisible ? 'Show password' : 'Hide password');
        passwordToggle.setAttribute('title', isPasswordVisible ? 'Show password' : 'Hide password');
        passwordToggle.innerHTML = `<i class="fa-solid ${isPasswordVisible ? 'fa-eye' : 'fa-eye-slash'}" aria-hidden="true"></i>`;
    });
   
    loginForm.addEventListener('submit', async function(event) {
        event.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
            await login(email, password);
        } catch (error) {
            alert(error.message || 'Unable to sign in. Please check your details.');
        }
    });
    </script>
</body>
</html>
